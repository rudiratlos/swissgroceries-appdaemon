name: Swissgroceries MCP
version: "1.1.1"
slug: swissgroceries_mcp
description: Schweizer Supermarkt-Aktionen (Migros, Coop, Aldi, Denner, Lidl ...) als HTTP-Dienst
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
watchdog: "http://[HOST]:[PORT:8080]/health"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Promotions-API (POST /promotions)"
options:
  request_timeout: 90
  gap_ms: 500
  log_level: info
schema:
  request_timeout: "int(10,300)"
  gap_ms: "int(0,10000)"
  log_level: "list(info|debug)"
