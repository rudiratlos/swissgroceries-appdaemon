name: Release

# Läuft, wenn ein Tag wie v1.2.3 gepusht wird.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Passt das Tag zur Version in config.yaml?
        run: |
          V=$(sed -n 's/^version: "\(.*\)"/\1/p' swissgroceries_mcp/config.yaml)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME passt nicht zu version $V in config.yaml"; exit 1; }
      - name: Tests und Syntaxprüfung
        run: |
          pip install pytest
          python -m pytest -q
          node --check swissgroceries_mcp/server.mjs
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip -r "swissgroceries-${GITHUB_REF_NAME#v}.zip" apps swissgroceries_mcp LICENSE README.md
          gh release create "$GITHUB_REF_NAME" ./*.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
